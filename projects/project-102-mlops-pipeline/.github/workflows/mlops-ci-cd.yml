name: MLOps CI/CD Pipeline

# Trigger conditions
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Manual trigger

env:
  PYTHON_VERSION: '3.11'
  DOCKER_REGISTRY: ghcr.io
  MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

permissions:
  contents: read
  packages: write

jobs:
  # Job 1: Code Quality and Linting
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black isort mypy

      - name: Run Ruff (linting)
        run: ruff check src/ dags/ tests/ --output-format=github || true

      - name: Run Black (code formatting check)
        run: black --check src/ dags/ tests/

      - name: Run isort (import sorting check)
        run: isort --check-only src/ dags/ tests/

      - name: Run mypy (type checking)
        run: mypy src/ --ignore-missing-imports --warn-unused-ignores || true

  # Job 2: Unit Tests
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-mock

      - name: Run unit tests with coverage
        run: pytest tests/ -v --cov=src --cov-report=xml --cov-report=html -m "unit" || true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # Job 3: Data Pipeline Tests
  data-pipeline-tests:
    name: Data Pipeline Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock

      - name: Run data pipeline tests
        run: |
          pytest tests/test_data.py -v -m "unit" --tb=short || true

  # Job 4: Model Training Tests
  model-training-tests:
    name: Model Training Tests
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-timeout

      - name: Run model training tests
        run: pytest tests/test_training.py -v -m "unit" --tb=short --timeout=300 || true

  # Job 5: Build Docker Image
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [unit-tests, data-pipeline-tests, model-training-tests]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/mlops-pipeline:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/mlops-pipeline:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 6: Validate Airflow DAGs
  validate-airflow-dags:
    name: Validate Airflow DAGs
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-airflow-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-airflow-

      - name: Install Airflow and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install apache-airflow==2.8.0
          pip install -r requirements.txt

      - name: Validate DAG syntax
        run: |
          python -c "
          import sys
          from airflow.models import DagBag
          dagbag = DagBag('dags/')
          if dagbag.import_errors:
            print('DAG Import Errors:')
            for dag_id, error in dagbag.import_errors.items():
              print(f'  {dag_id}: {error}')
            sys.exit(1)
          print(f'✓ All {len(dagbag.dags)} DAGs validated successfully')
          "

  # Job 7: Security Scanning
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml] safety

      - name: Run Bandit (Python security linter)
        run: bandit -r src/ dags/ -ll -f json -o bandit-report.json || true

      - name: Check dependencies for vulnerabilities
        run: safety check --json --ignore 000 || true

      - name: Upload Bandit report
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: bandit-report.json
          category: bandit
        continue-on-error: true
